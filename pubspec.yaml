name: softverse_kds
description: "A Flutter project with GetX boilerplate."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  intl: ^0.20.2
  url_launcher: ^6.3.2
  flutter_screenutil: ^5.9.3
  google_fonts: ^8.0.2
  shared_preferences: ^2.5.5
  get: ^4.7.3
  iconsax_flutter: ^1.0.1
  skeletonizer: ^2.1.3
  flutter_dotenv: ^5.2.1
  sqflite: ^2.4.2
  path: ^1.9.1
  flutter_tts: ^4.2.0
  package_info_plus: ^8.1.2
  toastification: ^3.2.0
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icons/
    - assets/images/
    - assets/sounds/
